<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-label="Speak on your Mac, the text is typed there and copied, then paste the same sentence on your iPhone">
  <title>Speak on your Mac, paste on your iPhone</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16181D"/>
      <stop offset="1" stop-color="#0B0C0F"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F2128"/>
      <stop offset="1" stop-color="#15161B"/>
    </linearGradient>
    <clipPath id="card"><rect width="1000" height="480" rx="24"/></clipPath>
    <clipPath id="phone"><rect x="752" y="66" width="196" height="356" rx="30"/></clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif; }
    /* 9 s story: idle, speak on Mac (1-3.6 s), transcribe, typed + copied, copy travels, long-press Paste, pasted on iPhone */
    .listen  { animation: listen 9s infinite; }
    .work    { animation: work 9s infinite; }
    .typed   { animation: typed 9s infinite; }
    .before  { animation: before 9s infinite; }
    .fly     { animation: fly 9s infinite; }
    .trail   { animation: trail 9s infinite; }
    .menu    { animation: menu 9s infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    .touch   { animation: touch 9s infinite; transform-box: fill-box; transform-origin: center; }
    .pasted  { animation: pasted 9s infinite; }
    .pbefore { animation: pbefore 9s infinite; }
    .copied  { animation: copied 9s infinite; }
    .b       { animation: wave 0.6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    .blink   { animation: blink 1s steps(1) infinite; }
    .spin    { animation: spin 0.9s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes listen  { 0%,10% { opacity: 0; } 11%,40% { opacity: 1; } 41%,100% { opacity: 0; } }
    @keyframes work    { 0%,40% { opacity: 0; } 41%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes typed   { 0%,49% { opacity: 0; } 51%,95% { opacity: 1; } 98%,100% { opacity: 0; } }
    @keyframes before  { 0%,49% { opacity: 1; } 50%,97% { opacity: 0; } 99%,100% { opacity: 1; } }
    @keyframes copied  { 0%,51% { opacity: 0; } 53%,95% { opacity: 1; } 98%,100% { opacity: 0; } }
    @keyframes trail   { 0%,53% { opacity: 0; } 55%,95% { opacity: 1; } 98%,100% { opacity: 0; } }
    @keyframes fly {
      0%,53%  { opacity: 0; transform: translate(0px, 0px) scale(0.6); }
      55%     { opacity: 1; transform: translate(0px, 0px) scale(1); }
      60%     { transform: translate(90px, -58px) scale(1); }
      65%     { transform: translate(190px, -62px) scale(1); }
      70%     { opacity: 1; transform: translate(276px, -4px) scale(1); }
      72%,100% { opacity: 0; transform: translate(290px, 10px) scale(0.6); }
    }
    @keyframes touch   { 0%,72% { opacity: 0; transform: scale(0.4); } 74%,79% { opacity: 0.9; transform: scale(1); } 81%,100% { opacity: 0; transform: scale(1.3); } }
    @keyframes menu    { 0%,74% { opacity: 0; transform: scale(0.7); } 76%,81% { opacity: 1; transform: scale(1); } 83%,100% { opacity: 0; transform: scale(1); } }
    @keyframes pasted  { 0%,81% { opacity: 0; } 83%,95% { opacity: 1; } 98%,100% { opacity: 0; } }
    @keyframes pbefore { 0%,81% { opacity: 1; } 82%,97% { opacity: 0; } 99%,100% { opacity: 1; } }
    @keyframes wave    { from { transform: scaleY(0.25); } to { transform: scaleY(1); } }
    @keyframes blink   { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes spin    { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .listen, .work, .typed, .before, .fly, .trail, .menu, .touch, .pasted, .pbefore, .copied, .b, .blink, .spin { animation: none; }
      .listen, .work, .before, .fly, .menu, .touch, .pbefore { opacity: 0; }
      .typed, .copied, .trail, .pasted { opacity: 1; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="480" fill="url(#bg)"/>
    <rect x="0.5" y="0.5" width="999" height="479" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

    <!-- ===================== Mac ===================== -->
    <rect x="52" y="66" width="500" height="312" rx="18" fill="#2A2C33"/>
    <rect x="62" y="76" width="480" height="292" rx="10" fill="url(#screen)"/>
    <path d="M18 378 H586 L566 396 a8 8 0 0 1 -6 3 H44 a8 8 0 0 1 -6 -3 Z" fill="#3A3D46"/>
    <rect x="262" y="378" width="80" height="6" rx="3" fill="#2A2C33"/>
    <!-- menu bar on the Mac screen with the VoiceFlow icon -->
    <rect x="62" y="76" width="480" height="26" rx="10" fill="#26282F"/>
    <rect x="62" y="92" width="480" height="10" fill="#26282F"/>
    <text x="78" y="94" class="sans" font-size="12" font-weight="600" fill="#E8E8ED">Notes</text>
    <g transform="translate(500,80)">
      <rect x="4" y="2" width="7" height="11" rx="3.5" fill="#E8E8ED"/>
      <path d="M1.5 8.5 a6 6 0 0 0 12 0" fill="none" stroke="#E8E8ED" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="7.5" y1="15" x2="7.5" y2="18" stroke="#E8E8ED" stroke-width="1.4" stroke-linecap="round"/>
      <circle class="listen" cx="14" cy="3.5" r="3.8" fill="#FF453A"/>
      <circle class="work" cx="14" cy="3.5" r="3.8" fill="#FFD60A"/>
    </g>
    <!-- a note being written -->
    <text x="92" y="146" class="sans" font-size="22" font-weight="700" fill="#F5F5F7">Plans tonight</text>
    <text x="92" y="172" class="sans" font-size="13" fill="#8E8E93">Today at 18:42</text>
    <g class="before"><rect class="blink" x="92" y="196" width="2.5" height="22" fill="#FFD60A"/></g>
    <g class="typed">
      <text x="92" y="214" class="sans" font-size="19" fill="#F5F5F7">On my way, see you at 7.</text>
      <rect class="blink" x="303" y="196" width="2.5" height="22" fill="#FFD60A"/>
    </g>

    <!-- Mac status (one at a time) -->
    <g class="sans" font-size="15">
      <g class="listen">
        <rect x="92" y="290" width="420" height="52" rx="14" fill="#0A84FF" fill-opacity="0.12" stroke="#0A84FF" stroke-opacity="0.5"/>
        <circle cx="116" cy="316" r="6" fill="#FF453A"/>
        <text x="132" y="321" fill="#F5F5F7">Holding right ⌥, speaking…</text>
        <g fill="#0A84FF">
          <rect class="b" x="380" y="304" width="5" height="24" rx="2.5" style="animation-delay:-0.1s"/>
          <rect class="b" x="390" y="298" width="5" height="36" rx="2.5" style="animation-delay:-0.4s"/>
          <rect class="b" x="400" y="302" width="5" height="28" rx="2.5" style="animation-delay:-0.2s"/>
          <rect class="b" x="410" y="296" width="5" height="40" rx="2.5" style="animation-delay:-0.5s"/>
          <rect class="b" x="420" y="303" width="5" height="26" rx="2.5" style="animation-delay:-0.3s"/>
          <rect class="b" x="430" y="299" width="5" height="34" rx="2.5" style="animation-delay:-0.15s"/>
          <rect class="b" x="440" y="305" width="5" height="22" rx="2.5" style="animation-delay:-0.45s"/>
          <rect class="b" x="450" y="301" width="5" height="30" rx="2.5" style="animation-delay:-0.25s"/>
          <rect class="b" x="460" y="306" width="5" height="20" rx="2.5" style="animation-delay:-0.35s"/>
          <rect class="b" x="470" y="309" width="5" height="14" rx="2.5" style="animation-delay:-0.05s"/>
        </g>
      </g>
      <g class="work">
        <rect x="92" y="290" width="420" height="52" rx="14" fill="#FFD60A" fill-opacity="0.08" stroke="#FFD60A" stroke-opacity="0.4"/>
        <circle class="spin" cx="116" cy="316" r="7" fill="none" stroke="#FFD60A" stroke-width="2.5" stroke-dasharray="30 14" stroke-linecap="round"/>
        <text x="132" y="321" fill="#F5F5F7">Transcribing on your Mac</text>
      </g>
      <g class="copied">
        <rect x="92" y="290" width="420" height="52" rx="14" fill="#30D158" fill-opacity="0.08" stroke="#30D158" stroke-opacity="0.4"/>
        <circle cx="116" cy="316" r="6" fill="#30D158"/>
        <text x="132" y="321" fill="#F5F5F7">Typed here, and copied to your clipboard</text>
      </g>
    </g>
    <text x="302" y="456" text-anchor="middle" class="sans" font-size="15" fill="#8E8E93">1. Speak on your Mac</text>

    <!-- ===================== Handoff ===================== -->
    <path class="trail" d="M520 236 C 600 150, 700 150, 790 236" fill="none" stroke="#0A84FF" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="4 7"/>
    <g class="fly">
      <g transform="translate(508,222)">
        <rect x="0" y="0" width="30" height="36" rx="6" fill="#0A84FF"/>
        <rect x="9" y="-4" width="12" height="7" rx="2.5" fill="#F5F5F7"/>
        <rect x="7" y="12" width="16" height="2.5" rx="1.2" fill="#F5F5F7"/>
        <rect x="7" y="18" width="16" height="2.5" rx="1.2" fill="#F5F5F7"/>
        <rect x="7" y="24" width="10" height="2.5" rx="1.2" fill="#F5F5F7"/>
      </g>
    </g>
    <text x="640" y="124" text-anchor="middle" class="sans" font-size="13" fill="#0A84FF">
      <tspan class="trail">Universal Clipboard</tspan>
    </text>
    <text x="640" y="142" text-anchor="middle" class="sans" font-size="12" fill="#8E8E93"><tspan class="trail">your devices only, encrypted</tspan></text>

    <!-- ===================== iPhone ===================== -->
    <rect x="744" y="58" width="212" height="372" rx="38" fill="#2A2C33"/>
    <rect x="752" y="66" width="196" height="356" rx="30" fill="url(#screen)"/>
    <g clip-path="url(#phone)">
      <rect x="822" y="76" width="56" height="16" rx="8" fill="#0B0C0F"/>
      <text x="778" y="89" class="sans" font-size="12" font-weight="600" fill="#E8E8ED">18:42</text>
      <!-- Messages header -->
      <circle cx="850" cy="124" r="16" fill="#3A3D46"/>
      <text x="850" y="129" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#F5F5F7">A</text>
      <text x="850" y="158" text-anchor="middle" class="sans" font-size="11" fill="#AEAEB2">Alex</text>
      <line x1="752" y1="172" x2="948" y2="172" stroke="#FFFFFF" stroke-opacity="0.06"/>
      <!-- earlier message -->
      <rect x="766" y="190" width="124" height="34" rx="16" fill="#2C2E35"/>
      <text x="780" y="212" class="sans" font-size="12" fill="#F5F5F7">Where are you?</text>
      <!-- input field -->
      <rect x="764" y="368" width="172" height="34" rx="17" fill="none" stroke="#48484A" stroke-width="1.5"/>
      <g class="pbefore">
        <text x="780" y="390" class="sans" font-size="12" fill="#636366">Message</text>
        <rect class="blink" x="779" y="377" width="2" height="16" fill="#0A84FF"/>
      </g>
      <g class="pasted">
        <text x="780" y="390" class="sans" font-size="12" fill="#F5F5F7">On my way, see you at 7.</text>
        <rect class="blink" x="922" y="377" width="2" height="16" fill="#0A84FF"/>
      </g>
      <!-- long-press: finger and the Paste menu -->
      <circle class="touch" cx="830" cy="385" r="16" fill="#FFFFFF" fill-opacity="0.25" stroke="#FFFFFF" stroke-opacity="0.5"/>
      <g class="menu">
        <rect x="786" y="318" width="88" height="36" rx="10" fill="#3A3D46"/>
        <path d="M824 354 l6 7 l6 -7 z" fill="#3A3D46"/>
        <text x="830" y="341" text-anchor="middle" class="sans" font-size="14" fill="#F5F5F7">Paste</text>
      </g>
    </g>
    <text x="850" y="456" text-anchor="middle" class="sans" font-size="15" fill="#8E8E93">2. Paste on your iPhone</text>
    <g class="pasted">
      <circle cx="770" cy="34" r="5" fill="#30D158"/>
      <text x="782" y="39" class="sans" font-size="14" fill="#F5F5F7">Same sentence, no retyping</text>
    </g>
  </g>
</svg>
