<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="1100" height="440" role="img" aria-label="Privacy diagram: microphone, Whisper and your cursor all stay inside your Mac; nothing is stored and there are no network connections">
  <title>Everything stays on your Mac</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16181D"/>
      <stop offset="1" stop-color="#0B0C0F"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0A84FF"/>
    </marker>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif; }
    .h { font-size: 17px; font-weight: 600; fill: #F5F5F7; }
    .s { font-size: 13px; fill: #8E8E93; }
    .cap { font-size: 12px; font-weight: 600; letter-spacing: 1.6px; }
  </style>

  <rect width="1100" height="440" rx="24" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1099" height="439" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- The Mac boundary -->
  <rect x="30" y="34" width="780" height="372" rx="20" fill="#0A84FF" fill-opacity="0.05" stroke="#0A84FF" stroke-opacity="0.55" stroke-width="1.5"/>
  <g transform="translate(56,52)">
    <rect x="0" y="7" width="14" height="11" rx="2.5" fill="#0A84FF"/>
    <path d="M3 8 V5 a4 4 0 0 1 8 0 V8" fill="none" stroke="#0A84FF" stroke-width="2"/>
  </g>
  <text x="80" y="69" class="sans cap" fill="#0A84FF">EVERYTHING HAPPENS ON YOUR MAC</text>

  <!-- Step nodes -->
  <g class="sans">
    <rect x="60" y="100" width="210" height="150" rx="16" fill="#1C1D22" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <g transform="translate(145,122)">
      <rect x="10" y="0" width="20" height="32" rx="10" fill="#F5F5F7"/>
      <path d="M3 20 a17 17 0 0 0 34 0" fill="none" stroke="#F5F5F7" stroke-width="3" stroke-linecap="round"/>
      <line x1="20" y1="38" x2="20" y2="45" stroke="#F5F5F7" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text x="165" y="200" text-anchor="middle" class="h">Microphone</text>
    <text x="165" y="222" text-anchor="middle" class="s">only while you hold ⌥</text>

    <rect x="300" y="100" width="210" height="150" rx="16" fill="#1C1D22" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <g transform="translate(383,122)" fill="none" stroke="#F5F5F7" stroke-width="3" stroke-linecap="round">
      <rect x="6" y="6" width="32" height="32" rx="6"/>
      <rect x="15" y="15" width="14" height="14" rx="2" fill="#F5F5F7" stroke="none"/>
      <path d="M14 0v6 M22 0v6 M30 0v6 M14 38v6 M22 38v6 M30 38v6 M0 14h6 M0 22h6 M0 30h6 M38 14h6 M38 22h6 M38 30h6"/>
    </g>
    <text x="405" y="200" text-anchor="middle" class="h">Whisper on the GPU</text>
    <text x="405" y="222" text-anchor="middle" class="s">open model, runs offline</text>

    <rect x="540" y="100" width="210" height="150" rx="16" fill="#1C1D22" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <g transform="translate(626,122)" fill="none" stroke="#F5F5F7" stroke-width="3" stroke-linecap="round">
      <path d="M8 2 h6 a6 6 0 0 1 6 6 a6 6 0 0 1 6 -6 h6 M20 8 v30 M8 44 h6 a6 6 0 0 0 6 -6 a6 6 0 0 0 6 6 h6"/>
    </g>
    <text x="645" y="200" text-anchor="middle" class="h">Your cursor</text>
    <text x="645" y="222" text-anchor="middle" class="s">text pasted, you press Enter</text>
  </g>
  <line x1="272" y1="175" x2="296" y2="175" stroke="#0A84FF" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="512" y1="175" x2="536" y2="175" stroke="#0A84FF" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Nothing kept -->
  <g class="sans">
    <rect x="60" y="280" width="210" height="96" rx="14" fill="none" stroke="#30D158" stroke-opacity="0.45" stroke-dasharray="5 5"/>
    <text x="80" y="312" class="h" font-size="15" fill="#30D158">Audio</text>
    <text x="80" y="336" class="s">kept in memory only,</text>
    <text x="80" y="355" class="s">thrown away after use</text>

    <rect x="300" y="280" width="210" height="96" rx="14" fill="none" stroke="#30D158" stroke-opacity="0.45" stroke-dasharray="5 5"/>
    <text x="320" y="312" class="h" font-size="15" fill="#30D158">Text</text>
    <text x="320" y="336" class="s">no history, and the log</text>
    <text x="320" y="355" class="s">never records your words</text>

    <rect x="540" y="280" width="210" height="96" rx="14" fill="none" stroke="#30D158" stroke-opacity="0.45" stroke-dasharray="5 5"/>
    <text x="560" y="312" class="h" font-size="15" fill="#30D158">Clipboard</text>
    <text x="560" y="336" class="s">this Mac only, hidden from</text>
    <text x="560" y="355" class="s">clipboard managers, wiped</text>
  </g>

  <!-- The internet, cut off -->
  <line x1="812" y1="220" x2="896" y2="220" stroke="#636366" stroke-width="2" stroke-dasharray="6 6"/>
  <g transform="translate(854,220)" stroke="#FF453A" stroke-width="3" stroke-linecap="round">
    <line x1="-9" y1="-9" x2="9" y2="9"/><line x1="9" y1="-9" x2="-9" y2="9"/>
  </g>
  <g transform="translate(905,168)">
    <path d="M30 80 h96 a26 26 0 0 0 0 -52 a36 36 0 0 0 -68 -10 a26 26 0 0 0 -28 62 z" fill="#1C1D22" stroke="#48484A" stroke-width="2"/>
  </g>
  <text x="985" y="292" text-anchor="middle" class="sans h" fill="#AEAEB2">The internet</text>
  <text x="985" y="316" text-anchor="middle" class="sans s">0 connections</text>
  <text x="985" y="335" text-anchor="middle" class="sans s">while it runs</text>
</svg>
