<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="VoiceFlow demo: hold right Option, speak, release, and the text is pasted into the terminal">
  <title>VoiceFlow: hold right Option, speak, release</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16181D"/>
      <stop offset="1" stop-color="#0B0C0F"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3D46"/>
      <stop offset="1" stop-color="#2A2C33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0A84FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1000" height="520" rx="24"/></clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; }
    /* 8 s story: 0-1 s idle, 1-4.4 s holding the key, 4.4-5.3 s transcribing, then pasted */
    .press   { animation: press 8s infinite; transform-box: fill-box; }
    .rec     { animation: rec 8s infinite; }
    .idle    { animation: idle 8s infinite; }
    .work    { animation: work 8s infinite; }
    .done    { animation: done 8s infinite; }
    .ready   { animation: ready 8s infinite; }
    .before  { animation: before 8s infinite; }
    .spin    { animation: spin 0.9s linear infinite; transform-box: fill-box; transform-origin: center; }
    .blink   { animation: blink 1s steps(1) infinite; }
    .b       { animation: wave 0.7s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    .pulse   { animation: pulse 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes press  { 0%,12% { transform: translateY(0); } 13%,54% { transform: translateY(7px); } 55%,100% { transform: translateY(0); } }
    @keyframes rec    { 0%,12% { opacity: 0; } 13%,54% { opacity: 1; } 55%,100% { opacity: 0; } }
    @keyframes idle   { 0%,12% { opacity: 1; } 13%,54% { opacity: 0; } 55%,100% { opacity: 1; } }
    @keyframes work   { 0%,54% { opacity: 0; } 55%,65% { opacity: 1; } 66%,100% { opacity: 0; } }
    @keyframes done   { 0%,65% { opacity: 0; } 67%,94% { opacity: 1; } 98%,100% { opacity: 0; } }
    @keyframes ready  { 0%,12% { opacity: 1; } 13%,97% { opacity: 0; } 99%,100% { opacity: 1; } }
    @keyframes before { 0%,65% { opacity: 1; } 66%,97% { opacity: 0; } 99%,100% { opacity: 1; } }
    @keyframes spin   { to { transform: rotate(360deg); } }
    @keyframes blink  { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes wave   { from { transform: scaleY(0.2); } to { transform: scaleY(1); } }
    @keyframes pulse  { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.25); opacity: 0.6; } }
    @media (prefers-reduced-motion: reduce) {
      .press, .rec, .idle, .work, .before, .ready, .spin, .blink, .b, .pulse { animation: none; }
      .rec, .work, .before, .ready { opacity: 0; }
      .done { animation: none; opacity: 1; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="520" fill="url(#bg)"/>
    <rect x="0.5" y="0.5" width="999" height="519" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

    <!-- macOS-style menu bar -->
    <rect width="1000" height="38" fill="#1E2026"/>
    <text x="28" y="25" class="sans" font-size="14" font-weight="600" fill="#E8E8ED">Terminal</text>
    <g class="sans" font-size="14" fill="#8E8E93"><text x="110" y="25">Shell</text><text x="160" y="25">Edit</text><text x="206" y="25">View</text><text x="256" y="25">Window</text></g>
    <text x="930" y="25" class="sans" font-size="14" fill="#E8E8ED">9:41</text>
    <!-- VoiceFlow menu bar icon: mic, plus a state badge -->
    <g transform="translate(882,8)">
      <rect x="5" y="2" width="8" height="13" rx="4" fill="#E8E8ED"/>
      <path d="M2 10 a7 7 0 0 0 14 0" fill="none" stroke="#E8E8ED" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="9" y1="17" x2="9" y2="21" stroke="#E8E8ED" stroke-width="1.6" stroke-linecap="round"/>
      <circle class="rec" cx="17" cy="4" r="4.5" fill="#FF453A"/>
      <circle class="work" cx="17" cy="4" r="4.5" fill="#FFD60A"/>
    </g>

    <!-- Row 1: key, waveform, status -->
    <ellipse class="rec" cx="150" cy="170" rx="120" ry="90" fill="url(#glow)"/>
    <g class="press">
      <rect x="78" y="104" width="144" height="124" rx="20" fill="#1A1B20"/>
      <rect x="78" y="98" width="144" height="122" rx="20" fill="url(#key)" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <rect class="rec" x="78" y="98" width="144" height="122" rx="20" fill="none" stroke="#0A84FF" stroke-width="2.5"/>
      <text x="150" y="160" text-anchor="middle" class="sans" font-size="44" fill="#F5F5F7">⌥</text>
      <text x="150" y="198" text-anchor="middle" class="sans" font-size="15" fill="#AEAEB2">option</text>
    </g>
    <text x="150" y="262" text-anchor="middle" class="sans" font-size="14" fill="#8E8E93">hold the right ⌥ key</text>

    <!-- waveform: a flat line when idle, live bars while recording -->
    <line class="idle" x1="282" y1="165" x2="690" y2="165" stroke="#3A3D46" stroke-width="3" stroke-linecap="round"/>
    <g class="rec" fill="#0A84FF">
      <rect class="b" x="282" y="155" width="6" height="20" rx="3" style="animation-delay:-0.1s"/>
      <rect class="b" x="296" y="148" width="6" height="34" rx="3" style="animation-delay:-0.5s"/>
      <rect class="b" x="310" y="138" width="6" height="54" rx="3" style="animation-delay:-0.3s"/>
      <rect class="b" x="324" y="130" width="6" height="70" rx="3" style="animation-delay:-0.6s"/>
      <rect class="b" x="338" y="140" width="6" height="50" rx="3" style="animation-delay:-0.2s"/>
      <rect class="b" x="352" y="122" width="6" height="86" rx="3" style="animation-delay:-0.4s"/>
      <rect class="b" x="366" y="115" width="6" height="100" rx="3" style="animation-delay:-0.65s"/>
      <rect class="b" x="380" y="128" width="6" height="74" rx="3" style="animation-delay:-0.15s"/>
      <rect class="b" x="394" y="110" width="6" height="110" rx="3" style="animation-delay:-0.45s"/>
      <rect class="b" x="408" y="120" width="6" height="90" rx="3" style="animation-delay:-0.25s"/>
      <rect class="b" x="422" y="105" width="6" height="120" rx="3" style="animation-delay:-0.55s"/>
      <rect class="b" x="436" y="116" width="6" height="98" rx="3" style="animation-delay:-0.05s"/>
      <rect class="b" x="450" y="108" width="6" height="114" rx="3" style="animation-delay:-0.35s"/>
      <rect class="b" x="464" y="124" width="6" height="82" rx="3" style="animation-delay:-0.6s"/>
      <rect class="b" x="478" y="112" width="6" height="106" rx="3" style="animation-delay:-0.2s"/>
      <rect class="b" x="492" y="126" width="6" height="78" rx="3" style="animation-delay:-0.5s"/>
      <rect class="b" x="506" y="118" width="6" height="94" rx="3" style="animation-delay:-0.3s"/>
      <rect class="b" x="520" y="132" width="6" height="66" rx="3" style="animation-delay:-0.1s"/>
      <rect class="b" x="534" y="124" width="6" height="82" rx="3" style="animation-delay:-0.45s"/>
      <rect class="b" x="548" y="136" width="6" height="58" rx="3" style="animation-delay:-0.65s"/>
      <rect class="b" x="562" y="130" width="6" height="70" rx="3" style="animation-delay:-0.25s"/>
      <rect class="b" x="576" y="142" width="6" height="46" rx="3" style="animation-delay:-0.55s"/>
      <rect class="b" x="590" y="138" width="6" height="54" rx="3" style="animation-delay:-0.15s"/>
      <rect class="b" x="604" y="146" width="6" height="38" rx="3" style="animation-delay:-0.4s"/>
      <rect class="b" x="618" y="150" width="6" height="30" rx="3" style="animation-delay:-0.6s"/>
      <rect class="b" x="632" y="154" width="6" height="22" rx="3" style="animation-delay:-0.3s"/>
      <rect class="b" x="646" y="157" width="6" height="16" rx="3" style="animation-delay:-0.5s"/>
      <rect class="b" x="660" y="159" width="6" height="12" rx="3" style="animation-delay:-0.2s"/>
      <rect class="b" x="674" y="160" width="6" height="10" rx="3" style="animation-delay:-0.4s"/>
    </g>

    <!-- status labels (one at a time) -->
    <g class="sans" font-size="16">
      <g class="ready"><circle cx="742" cy="160" r="6" fill="#636366"/><text x="758" y="166" fill="#8E8E93">Ready</text></g>
      <g class="rec"><circle class="pulse" cx="742" cy="160" r="6" fill="#FF453A"/><text x="758" y="166" fill="#F5F5F7">Listening…</text></g>
      <g class="work">
        <circle class="spin" cx="742" cy="160" r="7" fill="none" stroke="#FFD60A" stroke-width="2.5" stroke-dasharray="30 14" stroke-linecap="round"/>
        <text x="758" y="166" fill="#F5F5F7">Transcribing on your Mac</text>
      </g>
      <g class="done"><circle cx="742" cy="160" r="6" fill="#30D158"/><text x="758" y="166" fill="#F5F5F7">Pasted in 1.3 s</text></g>
    </g>
    <text x="742" y="194" class="sans" font-size="13" fill="#636366">no cloud · no history</text>

    <!-- Row 2: terminal window -->
    <rect x="60" y="300" width="880" height="160" rx="14" fill="#0E0F12" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <path d="M60 330 V314 a14 14 0 0 1 14 -14 H926 a14 14 0 0 1 14 14 V330 Z" fill="#1C1D22"/>
    <circle cx="84" cy="315" r="6" fill="#FF5F57"/>
    <circle cx="104" cy="315" r="6" fill="#FEBC2E"/>
    <circle cx="124" cy="315" r="6" fill="#28C840"/>
    <text x="500" y="320" text-anchor="middle" class="sans" font-size="13" fill="#8E8E93">Terminal — claude</text>

    <text x="84" y="372" class="mono" font-size="15" fill="#636366">Try "explain this codebase"</text>
    <text x="84" y="412" class="mono" font-size="20" fill="#D97757">›</text>
    <g class="before"><rect class="blink" x="106" y="395" width="11" height="22" fill="#E8E8ED"/></g>
    <g class="done">
      <text x="106" y="412" class="mono" font-size="20" fill="#F5F5F7">Refactor the login flow and add tests for the edge cases.</text>
      <rect class="blink" x="797" y="395" width="11" height="22" fill="#E8E8ED"/>
    </g>
    <text x="84" y="444" class="mono" font-size="13" fill="#48484A">you press Enter yourself, nothing is sent by accident</text>

    <text x="500" y="494" text-anchor="middle" class="sans" font-size="14" fill="#636366">Whisper large-v3-turbo on the Apple GPU  ·  works with Wi-Fi off  ·  free and open source</text>
  </g>
</svg>
